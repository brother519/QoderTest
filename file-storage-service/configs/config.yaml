server:
  port: 8080
  mode: development
  shutdown_timeout: 30s

database:
  host: localhost
  port: 5432
  user: filestore
  password: filestore
  dbname: filestore
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 10

storage:
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  region: us-east-1
  use_ssl: false
  default_bucket: filestore

cdn:
  enabled: false
  base_url: ""

upload:
  max_file_size: 5368709120
  chunk_size: 5242880
  session_expiry: 24h
  allowed_types:
    - "image/*"
    - "video/*"
    - "application/pdf"
    - "application/msword"
    - "application/vnd.openxmlformats-officedocument.*"

thumbnail:
  enabled: true
  sizes:
    small:
      width: 150
      height: 150
    medium:
      width: 500
      height: 500
    large:
      width: 1200
      height: 1200
  quality: 85

worker:
  concurrency: 10

cleanup:
  interval: 1h
  batch_size: 100

logging:
  level: debug
  format: json
